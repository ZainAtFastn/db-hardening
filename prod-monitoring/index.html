<style>
:root{--bg:#0b1020;--surface:rgba(255,255,255,.06);--ink:#e8ecf6;--ink-2:#9aa4bd;--line:rgba(255,255,255,.12);--accent:#38bdf8;--red:#fb7185}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f4f6fb;--surface:#fff;--ink:#141a2b;--ink-2:#5b6478;--line:#dfe3ec;--accent:#0284c7;--red:#e11d48}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;color:var(--ink);
font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
background:radial-gradient(1200px 600px at 10% -10%,rgba(56,189,248,.18),transparent),radial-gradient(900px 500px at 110% 110%,rgba(52,211,153,.14),transparent),var(--bg)}
form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:400px;backdrop-filter:blur(12px)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:p 2s infinite;margin-right:8px}
@keyframes p{70%{box-shadow:0 0 0 10px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}
h1{font-size:20px;margin:0 0 6px}p{color:var(--ink-2);font-size:14px;margin:0 0 18px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font-size:16px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;font-size:15px;cursor:pointer}
.err{color:var(--red);font-size:14px;margin-top:10px;min-height:20px}
</style></head><body>

async function open(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
